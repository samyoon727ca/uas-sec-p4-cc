# CC proxy policy (SR-011 allowlist, SR-012 rate limits, peer map) for GCS -> FC MAVLink traffic.
#
# STATUS: PROPOSED -- OWNER TO APPROVE.
# P1 (uas-sec-p1-architecture docs/07-requirements.md) fixes only the six SR-011
# exclusions below. The allowed_messages / allowed_commands lists, every rate
# and the peer map in this file are draft values proposed by this repo and are
# NOT yet approved by the owner. Do not treat them as a verified baseline until
# `status` is changed to `approved`.
#
# All names are resolved against pymavlink's MAVLink "common" dialect; an
# unknown name is a load error, never silently ignored.

status: proposed

# SR-011: always dropped, even if also listed in allowed_messages.
excluded_messages:
  - SERIAL_CONTROL
  - FILE_TRANSFER_PROTOCOL
  - SETUP_SIGNING
  - RADIO_STATUS
  - ADSB_VEHICLE
  - COLLISION

# Draft message allowlist (GCS -> FC). Anything not listed is dropped.
allowed_messages:
  - HEARTBEAT
  - COMMAND_LONG
  - COMMAND_INT
  - PARAM_REQUEST_LIST
  - PARAM_REQUEST_READ
  - PARAM_SET
  - MISSION_COUNT
  - MISSION_ITEM_INT
  - MISSION_REQUEST_INT
  - MISSION_REQUEST_LIST
  - MISSION_ACK
  - MISSION_CLEAR_ALL
  - MISSION_SET_CURRENT
  - SET_MODE
  - MANUAL_CONTROL
  - SYSTEM_TIME
  - TIMESYNC
  - PING

# Draft MAV_CMD allowlist applied to COMMAND_LONG / COMMAND_INT.
# Deliberately absent: MAV_CMD_PREFLIGHT_REBOOT_SHUTDOWN, MAV_CMD_PREFLIGHT_STORAGE,
# MAV_CMD_DO_FLIGHTTERMINATION and other maintenance/destructive commands.
allowed_commands:
  - MAV_CMD_REQUEST_MESSAGE
  - MAV_CMD_SET_MESSAGE_INTERVAL
  - MAV_CMD_COMPONENT_ARM_DISARM
  - MAV_CMD_DO_SET_MODE
  - MAV_CMD_NAV_TAKEOFF
  - MAV_CMD_NAV_LAND
  - MAV_CMD_NAV_RETURN_TO_LAUNCH
  - MAV_CMD_NAV_LOITER_UNLIM
  - MAV_CMD_MISSION_START
  - MAV_CMD_DO_REPOSITION
  - MAV_CMD_DO_CHANGE_SPEED

# Draft SR-012 token-bucket limits per message type: `rate` in msgs/s,
# `burst` = bucket size in msgs. `default` applies to any allowed message
# without its own entry. Each (peer, message type) pair has its own bucket,
# which starts full; a frame that finds it empty is dropped as `rate_limited`.
rates:
  default: {rate: 10, burst: 20}
  HEARTBEAT: {rate: 2, burst: 4}
  MANUAL_CONTROL: {rate: 50, burst: 50}
  COMMAND_LONG: {rate: 5, burst: 10}
  COMMAND_INT: {rate: 5, burst: 10}
  PARAM_SET: {rate: 5, burst: 10}
  PARAM_REQUEST_LIST: {rate: 0.2, burst: 1}
  MISSION_ITEM_INT: {rate: 20, burst: 50}

# Draft peer map: a frame's peer is looked up from its packet source IP.
# ASSUMPTION: this mirrors WireGuard AllowedIPs. Each peer would reach the CC
# over a WireGuard tunnel, and WireGuard's cryptokey routing only accepts an
# inner source IP inside the sending peer's AllowedIPs, so the source IP is
# bound to that peer's key. This slice runs without real tunnels, so the
# binding is assumed, not enforced. Lookup is longest-prefix match (as in
# WireGuard); a source no peer covers is dropped as `unknown_peer`.
peers:
  - name: gcs-primary
    allowed_ips: [10.8.0.2/32]
  # Loopback: processes on the CC itself. The tests also send from here.
  - name: cc-local
    allowed_ips: [127.0.0.1/32, "::1/128"]

# Peer whose traffic is CC-originated; it is labelled as such in counters.
local_peer: cc-local
