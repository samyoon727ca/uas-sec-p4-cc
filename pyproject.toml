[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-proxy"
version = "0.1.0"
description = "Inline MAVLink allowlist / rate-limit / command-log proxy for the UAS companion computer (P4 VE-10)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymavlink",
    "pyyaml",
]

[project.scripts]
cc-proxy = "cc_proxy.proxy:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "sitl: tests that need an ArduPilot SITL instance (deselect with -m \"not sitl\")",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
